<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; margin: 0; padding: 0; }
  body { background: #f0f4f8; padding: 14px; font-size: 14px; color: #1e293b; }
  .emblem-bar { background: #003366; color: #fff; padding: 10px 14px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .main-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 0 0 8px 8px; padding: 16px; }
  .lang-badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  h2 { font-size: 16px; color: #0f172a; margin: 10px 0 6px 0; }
  .input-label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block; }
  .large-input { width: 100%; height: 52px; font-size: 18px; border: 2px solid #94a3b8; border-radius: 6px; padding: 0 12px; font-weight: 600; margin-bottom: 12px; }
  .verified-box { background: #f0fdf4; border: 2px solid #86efac; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .check-icon { font-size: 24px; color: #16a34a; }
  .submit-btn { width: 100%; height: 54px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="emblem-bar">
    <span style="font-weight: 700; font-size: 13px;">राष्ट्रीय स्वास्थ्य मिशन (NHM / ABHA)</span>
    <span class="lang-badge">हिंदी (Hindi) ▼</span>
  </div>
  <div class="main-card">
    <div class="verified-box">
      <span class="check-icon">✓</span>
      <div>
        <p style="font-weight: 700; color: #166534; font-size: 14px;">डॉक्टर द्वारा सत्यापित पर्ची</p>
        <p style="font-size: 12px; color: #15803d;">रजिस्ट्रेशन सं: RMP-UP-88419</p>
      </div>
    </div>
    <label class="input-label">मरीज का 10 अंकों का मोबाइल नंबर (Mobile Number):</label>
    <input type="text" class="large-input" value="98765 43210" readonly>
    <button class="submit-btn">दवाओं का समय पत्रक देखें (View Schedule)</button>
  </div>
</body>
</html>
