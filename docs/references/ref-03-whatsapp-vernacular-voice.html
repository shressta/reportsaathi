<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; margin: 0; padding: 0; }
  body { background: #efeae2; padding: 12px; }
  .chat-header { background: #075e54; color: #fff; padding: 10px 14px; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
  .header-info h3 { font-size: 14px; font-weight: 600; }
  .header-info p { font-size: 11px; opacity: 0.85; }
  .chat-body { background: #efeae2; padding: 12px 6px; border: 1px solid #d1d7db; border-radius: 0 0 8px 8px; }
  .msg-bubble { background: #ffffff; border-radius: 8px 8px 8px 0; padding: 10px; max-width: 90%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); margin-bottom: 12px; }
  .voice-card { background: #e7f8e8; border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .play-btn { width: 44px; height: 44px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; flex-shrink: 0; cursor: pointer; }
  .waveform { flex-grow: 1; height: 24px; display: flex; align-items: center; gap: 3px; }
  .bar { width: 3px; background: #00a884; border-radius: 2px; }
  .duration { font-size: 11px; color: #667781; font-weight: 600; }
  .text-content { font-size: 14px; line-height: 1.5; color: #111b21; }
  .time-stamp { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
  .image-preview { width: 100%; border-radius: 6px; border: 1px solid #e2e8f0; margin-top: 6px; }
</style>
</head>
<body>
  <div class="chat-header">
    <div class="avatar">👨‍⚕️</div>
    <div class="header-info">
      <h3>डॉ. वर्मा क्लीनिक (ReportSaathi)</h3>
      <p>सत्यापित चिकित्सा सहायक • Verified Business</p>
    </div>
  </div>
  <div class="chat-body">
    <div class="msg-bubble">
      <p style="font-weight: 700; color: #075e54; font-size: 13px; margin-bottom: 6px;">नमस्ते रमेश जी, आपकी आज की दवाओं का नियम:</p>
      
      <div class="voice-card">
        <div class="play-btn">▶</div>
        <div style="flex-grow: 1;">
          <div class="waveform">
            <span class="bar" style="height: 12px;"></span>
            <span class="bar" style="height: 18px;"></span>
            <span class="bar" style="height: 8px;"></span>
            <span class="bar" style="height: 22px;"></span>
            <span class="bar" style="height: 14px;"></span>
            <span class="bar" style="height: 19px;"></span>
            <span class="bar" style="height: 10px;"></span>
            <span class="bar" style="height: 16px;"></span>
            <span class="bar" style="height: 24px;"></span>
            <span class="bar" style="height: 12px;"></span>
            <span class="bar" style="height: 8px;"></span>
          </div>
          <span class="duration">0:42 • अपनी आवाज में सुनें</span>
        </div>
      </div>

      <div class="text-content">
        ☀️ <strong>सुबह नाश्ते के बाद:</strong> टेल्मा 40 (बीपी की गोली) - 1 गोली<br>
        🌙 <strong>रात खाने के बाद:</strong> ग्लाइकोमेट 500 (शुगर की गोली) - 1 गोली
      </div>
      <div class="time-stamp">11:45 AM ✓✓</div>
    </div>
  </div>
</body>
</html>
